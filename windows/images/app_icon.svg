  <rect x="16" y="44" width="8" height="4" rx="1" fill="#BDBDBD"/>
  <rect x="26" y="44" width="8" height="4" rx="1" fill="#FF5722"/>
  <rect x="36" y="44" width="8" height="4" rx="1" fill="#BDBDBD"/>
  <!-- 收银机抽屉 -->
  <rect x="16" y="48" width="32" height="8" rx="2" fill="#FFC107"/>
